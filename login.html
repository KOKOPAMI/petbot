<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PetBot 로그인</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .input-field {
            width: 100%;
            height: 52px;
            border: 1px solid #eaeaea;
            border-radius: 16px;
            padding: 0 16px;
            font-size: 15px;
            background: #f9fafb;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s, background-color 0.2s;
        }
        .input-field:focus {
            border: 1px solid #8b5cf6;
            background: #ffffff;
        }
        .error-msg {
            color: #ff5b5b;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            display: none;
            margin: 0;
        }
        /* 회원가입 모달 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-card {
            background: #ffffff;
            width: 85%;
            max-width: 360px;
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transform: translateY(20px);
            transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }
    </style>
</head>
<body style="background: #f5f6f8;">

    <div class="app-container" style="box-shadow: none; background: transparent;">
        <div class="main-content" style="padding: 40px 24px;">
            
            <div style="text-align: center; margin-top: 30px;">
                <span style="font-size: 55px;">🔒</span>
                <h1 style="font-size: 24px; font-weight: 800; margin-top: 15px; color: #111111;">PetBot 관제 시스템</h1>
                <p style="color: #8e94a0; font-size: 14px; margin-top: 5px;">로그인 후 관제를 시작해 주세요.</p>
            </div>

            <div class="login-box">
                <input type="text" id="login-username" class="input-field" placeholder="아이디(ID)">
                <input type="password" id="login-password" class="input-field" placeholder="비밀번호(Password)" onkeyup="if(window.event.keyCode==13){submitLogin()}">
                
                <p class="error-msg" id="login-error">⚠️ 아이디 또는 비밀번호가 올바르지 않습니다.</p>
                
                <button class="action-bar-btn btn-action-purple" style="width: 100%; margin-top: 10px;" onclick="submitLogin()">
                    로그인
                </button>
                
                <div style="text-align: center; margin-top: 10px;">
                    <span style="color: #8e94a0; font-size: 14px;">계정이 없으신가요?</span>
                    <button style="background: none; border: none; color: #8b5cf6; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: underline; margin-left: 5px;" onclick="toggleModal(true)">회원가입</button>
                </div>
            </div>

        </div>
    </div>

    <div class="modal-overlay" id="register-modal">
        <div class="modal-card">
            <h2 style="font-size: 19px; font-weight: 800; margin-bottom: 5px; color: #111;">새 계정 만들기</h2>
            <p style="color: #8e94a0; font-size: 13px; margin-bottom: 20px;">관제 시스템에 사용할 계정을 생성합니다.</p>
            
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <input type="text" id="reg-username" class="input-field" placeholder="사용할 아이디">
                <input type="password" id="reg-password" class="input-field" placeholder="사용할 비밀번호">
            </div>
            
            <p class="error-msg" id="reg-error" style="margin-top: 10px;"></p>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="action-bar-btn" style="background: #eaeaea; color: #4e5561; flex: 1;" onclick="toggleModal(false)">취소</button>
                <button class="action-bar-btn btn-action-purple" style="flex: 1;" onclick="submitRegister()">가입 완료</button>
            </div>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById("register-modal");
            if (show) modal.classList.add("active");
            else {
                modal.classList.remove("active");
                document.getElementById("reg-error").style.display = "none";
            }
        }

        // 로그인 요청
        async function submitLogin() {
            const username = document.getElementById("login-username").value;
            const password = document.getElementById("login-password").value;
            const errorBlock = document.getElementById("login-error");

            if (!username || !password) return;

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    location.href = "/";
                } else {
                    errorBlock.style.display = "block";
                    document.getElementById("login-password").value = "";
                }
            } catch (e) {
                alert("서버 통신 실패");
            }
        }

        // 회원가입 요청
        async function submitRegister() {
            const username = document.getElementById("reg-username").value;
            const password = document.getElementById("reg-password").value;
            const errorBlock = document.getElementById("reg-error");

            if (!username || !password) {
                errorBlock.innerText = "⚠️ 모든 빈칸을 채워주세요.";
                errorBlock.style.display = "block";
                return;
            }

            try {
                const response = await fetch("/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    alert("🎉 회원가입이 완료되었습니다! 로그인해 주세요.");
                    toggleModal(false);
                    document.getElementById("login-username").value = username;
                } else {
                    const text = await response.text();
                    errorBlock.innerText = text === "EXISTS" ? "⚠️ 이미 존재하는 아이디입니다." : "⚠️ 가입에 실패했습니다.";
                    errorBlock.style.display = "block";
                }
            } catch (e) {
                alert("서버 통신 실패");
            }
        }
    </script>
</body>
</html>
