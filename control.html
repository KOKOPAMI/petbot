<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>원격 제어</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <div class="app-header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <span style="font-size: 20px; cursor: pointer;" onclick="goHome()">◀</span>
                <h1 style="font-size: 18px; font-weight: 700;">원격 제어</h1>
            </div>
            <div style="font-size: 20px; cursor: pointer;">⋮</div>
        </div>

        <div class="main-content">
            
            <div class="video-wrapper">
                <div class="video-overlay-hud">
                    <span class="live-dot-green"></span> 실시간
                </div>
                <div class="video-overlay-quality" id="top-battery-badge">🔋 72%</div>
                <video id="video" autoplay playsinline muted></video>
            </div>

            <div class="joystick-container">
                <div class="wheel-pad">
                    <button class="wheel-btn btn-up" 
                            onmousedown="sendDriveCmd('FORWARD')" ontouchstart="sendDriveCmd('FORWARD')"
                            onmouseup="sendDriveCmd('STOP')" ontouchend="sendDriveCmd('STOP')">
                        ▲<span>전진</span>
                    </button>
                    <button class="wheel-btn btn-down" 
                            onmousedown="sendDriveCmd('BACKWARD')" ontouchstart="sendDriveCmd('BACKWARD')"
                            onmouseup="sendDriveCmd('STOP')" ontouchend="sendDriveCmd('STOP')">
                        <span>후진</span>▼
                    </button>
                    <button class="wheel-btn btn-left" 
                            onmousedown="sendDriveCmd('LEFT')" ontouchstart="sendDriveCmd('LEFT')"
                            onmouseup="sendDriveCmd('STOP')" ontouchend="sendDriveCmd('STOP')">
                        ◀ <span>좌회전</span>
                    </button>
                    <button class="wheel-btn btn-right" 
                            onmousedown="sendDriveCmd('RIGHT')" ontouchstart="sendDriveCmd('RIGHT')"
                            onmouseup="sendDriveCmd('STOP')" ontouchend="sendDriveCmd('STOP')">
                        <span>우회전</span> ▶
                    </button>
                    
                    <div class="btn-center-stop" onclick="sendDriveCmd('STOP')">
                        <div class="stop-icon"></div>
                        정지
                    </div>
                </div>
            </div>

            <div class="control-bottom-bar">
                <button class="btn-emergency-stop" onclick="sendDriveCmd('EMERGENCY_STOP')">
                    <span style="font-size: 16px;">⚠️</span>
                    <span>긴급 정지</span>
                </button>

                <div class="speed-capsule">
                    <button class="speed-step-btn" onclick="adjustSpeed('DOWN')">−</button>
                    <div class="speed-label">
                        <span>속도</span>
                        <span id="speed-text" style="color: #3b82f6;">중간</span>
                    </div>
                    <button class="speed-step-btn" onclick="adjustSpeed('UP')">+</button>
                </div>

                <button class="btn-sub-action" onclick="alert('음성 송출이 준비되었습니다.')">
                    <span style="font-size: 16px;">🔊</span>
                    <span>음성</span>
                </button>
            </div>

        </div>

        <div class="bottom-nav">
            <div class="nav-item" onclick="goHome()">
                <span class="icon">🏠</span>
                <span>홈</span>
            </div>
            <div class="nav-item" onclick="location.href='/monitor'">
                <span class="icon">📹</span>
                <span>모니터링</span>
            </div>
            <div class="nav-item active">
                <span class="icon">🎮</span>
                <span>제어</span>
            </div>
        </div>

    </div>

<script>
let currentSpeedLevel = 2; // 1: 느림, 2: 중간, 3: 빠름
const speedMap = { 1: "느림", 2: "중간", 3: "빠름" };

function goHome(){ location.href = "/"; }

// 속도 스텝 가속 제어 로직
async function adjustSpeed(direction) {
    if (direction === 'UP' && currentSpeedLevel < 3) currentSpeedLevel++;
    if (direction === 'DOWN' && currentSpeedLevel > 1) currentSpeedLevel--;
    
    document.getElementById("speed-text").innerText = speedMap[currentSpeedLevel];
    
    // 백엔드로 현재 셋팅된 속도 레벨 전송
    try {
        await fetch("/control", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command: `SET_SPEED_${currentSpeedLevel}` })
        });
    } catch(e) { console.error("속도 조절 전송 실패:", e); }
}

// 🔥 고속 조종 명령 API 싱크탱크
async function sendDriveCmd(cmd) {
    try {
        await fetch("/control", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command: cmd })
        });
    } catch (e) {
        console.error("이동 명령 통신 실패:", e);
    }
}

// 상단 배터리 스탯 동기화 서브 루틴
async function syncControlHeader() {
    try {
        const res = await fetch("/status");
        if (res.ok) {
            const data = await res.json();
            document.getElementById("top-battery-badge").innerText = `🔋 ${data.battery}%`;
        }
    } catch(e){}
}
setInterval(syncControlHeader, 3000);

// WebRTC 스트리밍 엔진 바인딩
const video = document.getElementById("video");
let pc = null;

async function startControlWebRTC() {
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.ontrack = (event) => {
        video.srcObject = event.streams[0];
        video.play();
    };
    pc.addTransceiver("video", { direction: "recvonly" });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const response = await fetch("/offer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
    });
    const answer = await response.json();
    await pc.setRemoteDescription(answer);
}
startControlWebRTC();
</script>
</body>
</html>
