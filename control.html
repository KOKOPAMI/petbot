<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>원격 제어</title>

<link rel="stylesheet" href="style.css">

<style>

.volume-panel{
background:#fff;
border-radius:18px;
padding:14px;
display:flex;
flex-direction:column;
gap:10px;
width:150px;
}

.volume-row{
display:flex;
justify-content:space-between;
align-items:center;
}

.volume-slider{
width:100%;
}

.audio-section{
display:flex;
gap:14px;
margin-top:16px;
}

.mic-large-btn{

flex:1;

height:76px;

border:none;

border-radius:18px;

background:#3b82f6;

color:white;

font-size:18px;

font-weight:700;

white-space:nowrap;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

box-shadow:
0 6px 20px
rgba(59,130,246,.2);

}

.mic-active{
background:#22c55e !important;
}

</style>

</head>

<body>

<div class="app-container">

<div class="app-header">

<div style="display:flex;align-items:center;gap:15px;">

<span
style="font-size:20px;cursor:pointer"
onclick="goHome()">

◀

</span>

<h1
style="
font-size:18px;
font-weight:700;
">

원격 제어

</h1>

</div>

<div style="font-size:20px;">
⋮
</div>

</div>

<div class="main-content">

<div class="video-wrapper">

<div class="video-overlay-hud">
<span class="live-dot-green"></span>
실시간
</div>

<div
class="video-overlay-quality"
id="top-battery-badge">

🔋 72%

</div>

<video
id="video"
autoplay
playsinline
muted>
</video>

</div>

<div class="joystick-container">

<div class="wheel-pad">

<button
class="wheel-btn btn-up"
onmousedown="sendDriveCmd('FORWARD')"
ontouchstart="touchStart(event,'FORWARD')"
onmouseup="sendDriveCmd('STOP')"
ontouchend="sendDriveCmd('STOP')">

▲
<span>전진</span>

</button>

<button
class="wheel-btn btn-down"
onmousedown="sendDriveCmd('BACKWARD')"
ontouchstart="touchStart(event,'BACKWARD')"
onmouseup="sendDriveCmd('STOP')"
ontouchend="sendDriveCmd('STOP')">

<span>후진</span>
▼

</button>

<button
class="wheel-btn btn-left"
onmousedown="sendDriveCmd('LEFT')"
ontouchstart="touchStart(event,'LEFT')"
onmouseup="sendDriveCmd('STOP')"
ontouchend="sendDriveCmd('STOP')">

◀
<span>좌회전</span>

</button>

<button
class="wheel-btn btn-right"
onmousedown="sendDriveCmd('RIGHT')"
ontouchstart="touchStart(event,'RIGHT')"
onmouseup="sendDriveCmd('STOP')"
ontouchend="sendDriveCmd('STOP')">

<span>우회전</span>
▶

</button>

<div
class="btn-center-stop"
onclick="sendDriveCmd('STOP')">

<div class="stop-icon"></div>

정지

</div>

</div>

</div>

<div class="control-bottom-bar">

<button
class="btn-emergency-stop"
onclick="sendDriveCmd('EMERGENCY_STOP')">

⚠️ 긴급 정지

</button>

<div class="audio-section">

<button
id="micBtn"
class="mic-large-btn"
onclick="toggleVoice()">

🎤 음성 시작

</button>


<div class="speed-capsule">

<button
class="speed-step-btn"
onclick="adjustSpeed('DOWN')">

−

</button>

<div class="speed-label">

<span>속도</span>

<span
id="speed-text"
style="color:#3b82f6">

중간

</span>

</div>

<button
class="speed-step-btn"
onclick="adjustSpeed('UP')">

+

</button>

</div>

<div class="volume-panel">

<div class="volume-row">

<span>🔊 볼륨</span>

<span id="volume-value">

100%

</span>

</div>

<input
class="volume-slider"
id="volume"
type="range"
min="0"
max="100"
value="100">

</div>

</div>

</div>

<div class="bottom-nav">

<div class="nav-item" onclick="location.href='/'">
🏠 홈
</div>

<div class="nav-item" onclick="location.href='/monitor'">
📹 모니터
</div>

<div class="nav-item active">
🎮 조종
</div>

<div class="nav-item" onclick="location.href='/settings'">
⚙️ 설정
</div>

</div>

</div>

<script>

let currentSpeedLevel=2

const speedMap={
1:"느림",
2:"중간",
3:"빠름"
}

function goHome(){
location.href="/"
}

function touchStart(e,cmd){
e.preventDefault()
sendDriveCmd(cmd)
}

async function adjustSpeed(direction){

if(direction==="UP"&&currentSpeedLevel<3)
currentSpeedLevel++

if(direction==="DOWN"&&currentSpeedLevel>1)
currentSpeedLevel--

document.getElementById(
"speed-text"
).innerText=
speedMap[currentSpeedLevel]

await fetch("/control",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
command:`SET_SPEED_${currentSpeedLevel}`
})
})

}

async function sendDriveCmd(cmd){

try{

await fetch(
"/control",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:
JSON.stringify({
command:cmd
})

}
)

}catch(e){

console.log(e)

}

}

document
.getElementById("volume")
.addEventListener(
"input",

async(e)=>{

const v=e.target.value

document
.getElementById(
"volume-value"
)
.innerText=
v+"%"

await fetch(
"/volume",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:
JSON.stringify({
volume:v
})

}
)

}

)

async function syncControlHeader(){

try{

const res=
await fetch("/status")

if(res.ok){

const data=
await res.json()

document
.getElementById(
"top-battery-badge"
)
.innerText=
`🔋 ${data.battery}%`

}

}catch{}

}

setInterval(
syncControlHeader,
3000
)

const video=
document.getElementById(
"video"
)

let pc
let localAudio=null
let micEnabled=false

async function startControlWebRTC(){

pc=
new RTCPeerConnection()

pc.ontrack=
(e)=>{

video.srcObject=
e.streams[0]

}

pc.addTransceiver(
"video",
{
direction:
"recvonly"
}
)

await negotiate()

}

async function negotiate(){

const offer=
await pc.createOffer()

await pc.setLocalDescription(
offer
)

const res=
await fetch(
"/offer",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

sdp:
pc.localDescription.sdp,

type:
pc.localDescription.type

})

}
)

const answer=
await res.json()

await pc.setRemoteDescription(
answer
)

}

async function toggleVoice(){

const btn=
document.getElementById(
"micBtn"
)

try{

if(!micEnabled){

localAudio=
await navigator.mediaDevices.getUserMedia({
audio:true
})

localAudio
.getTracks()
.forEach(
t=>
pc.addTrack(
t,
localAudio
)
)

await negotiate()

micEnabled=true

btn.innerHTML=
"🟢 음성 송출 중"

btn.classList.add(
"mic-active"
)

}
else{

localAudio
.getTracks()
.forEach(
t=>t.stop()
)

localAudio=null

micEnabled=false

btn.innerHTML=
"🎤 음성 시작"

btn.classList.remove(
"mic-active"
)

}

}catch(e){

alert(
"마이크 연결 실패"
)

console.log(e)

}

}

window.addEventListener(
"beforeunload",

()=>{

localAudio
?.getTracks()
.forEach(
t=>t.stop()
)

}

)

startControlWebRTC()

</script>

</body>
</html>
