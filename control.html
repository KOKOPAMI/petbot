<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>원격 제어</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        원격 제어
    </div>

    <div class="container">

        <div class="video-box">
            <div class="hud-live">
                <span class="live-dot"></span> LIVE
            </div>
            
            <div class="hud-bracket top-left"></div>
            <div class="hud-bracket top-right"></div>
            <div class="hud-bracket bottom-left"></div>
            <div class="hud-bracket bottom-right"></div>

            <video id="video" autoplay playsinline muted></video>
        </div>

        <div class="card">
            <div class="status-row">
                <span>연결 상태</span>
                <span id="robot-state" style="color: #4CAF50; font-weight: bold;">CONNECTING...</span>
            </div>
            <div class="status-row">
                <span>배터리 / WiFi</span>
                <span id="robot-battery">- % / -</span>
            </div>
            <div class="status-row">
                <span>인식된 객체</span>
                <span id="robot-detected" style="font-weight: bold; color: #ff5722;">NONE</span>
            </div>
            <div class="status-row">
                <span>현재 모드</span>
                <span id="robot-mode" style="font-weight: bold;">MANUAL</span>
            </div>
        </div>

        <div class="card" id="pet-temp-card" style="transition: all 0.5s ease; border: 1px solid #30363d; padding: 15px; background: #161b22; border-radius: 6px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span style="color: #8b949e; font-size: 13px;">🐾 반려동물 체온</span>
                    <h2 id="pet-temp-display" style="margin: 5px 0 0 0; font-size: 28px; color: #ffffff;">--.- °C</h2>
                </div>
                <div id="temp-emoji" style="font-size: 32px; transition: transform 0.3s;">🌡️</div>
            </div>
        </div>

        <div class="card" style="text-align: center;">
            <button id="track-toggle-btn" class="control-btn" style="width: 80%; max-width: 300px; background-color: #2196F3; color: white; border-radius: 20px; padding: 12px; font-weight: bold;" onclick="toggleAutoTrack()">
                🤖 AI 자율 추적 시작
            </button>
        </div>

        <div class="card" style="text-align: center;">
            <button id="mic-toggle-btn" class="control-btn" style="width: 80%; max-width: 300px; background-color: #34495e; color: white; border-radius: 20px; padding: 12px; font-weight: bold; border: none;" onclick="toggleMic()">
                🎤 마이크 오디오 송출 시작
            </button>
        </div>

        <div class="card">
            <h2 style="text-align:center;">컨트롤 패드</h2>
            <div class="control-pad">
                <button class="control-btn forward"
                        onmousedown="sendCommand('FORWARD')"
                        onmouseup="sendCommand('STOP')"
                        ontouchstart="event.preventDefault(); sendCommand('FORWARD')"
                        ontouchend="event.preventDefault(); sendCommand('STOP')"
                        ontouchcancel="event.preventDefault(); sendCommand('STOP')"> ▲
                </button>

                <button class="control-btn left"
                onmousedown="sendCommand('LEFT')"
                onmouseup="sendCommand('STOP')"
                ontouchstart="event.preventDefault(); sendCommand('LEFT')"
                ontouchend="event.preventDefault(); sendCommand('STOP')">
                ◀
                </button>

                <button class="control-btn stop stop-btn" onclick="sendCommand('STOP')">■</button>

                <button class="control-btn right"
                onmousedown="sendCommand('RIGHT')"
                onmouseup="sendCommand('STOP')"
                ontouchstart="event.preventDefault(); sendCommand('RIGHT')"
                ontouchend="event.preventDefault(); sendCommand('STOP')">
                ▶
                </button>

                <button class="control-btn back"
                onmousedown="sendCommand('BACK')"
                onmouseup="sendCommand('STOP')"
                ontouchstart="event.preventDefault(); sendCommand('BACK')"
                ontouchend="event.preventDefault(); sendCommand('STOP')">
                ▼
                </button>
            </div>
        </div>

    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="goHome()">🏠<br>홈</div>
        <div class="nav-item" onclick="goMonitor()">📹<br>모니터링</div>
        <div class="nav-item">🎮<br>제어</div>
    </div>

<script>
    let isAlertCooldown = false; 

    document.addEventListener("DOMContentLoaded", () => {
        if (Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    console.log("알림 권한이 허용되었습니다.");
                }
            });
        }
    });

function goHome(){
    location.href = "/";
}

function goMonitor(){
    location.href = "/monitor";
}

let lastCommand = "";
let isAutoTracking = false;

function sendCommand(command){
    if(command === lastCommand) return;
    lastCommand = command;

    fetch("/control", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command })
    });
}

function toggleAutoTrack() {
    const btn = document.getElementById("track-toggle-btn");
    if (!isAutoTracking) {
        sendCommand("AUTO_TRACK_ON");
        isAutoTracking = true;
        btn.innerText = "■ 자율 추적 중지";
        btn.style.backgroundColor = "#e91e63"; 
    } else {
        sendCommand("AUTO_TRACK_OFF");
        isAutoTracking = false;
        btn.innerText = "🤖 AI 자율 추적 시작";
        btn.style.backgroundColor = "#2196F3"; 
    }
}

async function updateRobotStatus() {
    try {
        const response = await fetch("/status");
        if (!response.ok) return;
        const data = await response.json(); 

        document.getElementById("robot-state").innerText = data.state;
        document.getElementById("robot-state").style.color = "#4CAF50";
        document.getElementById("robot-battery").innerText = `${data.battery}% / ${data.wifi}`;
        document.getElementById("robot-detected").innerText = data.detected;
        document.getElementById("robot-mode").innerText = data.mode;

        isAutoTracking = (data.mode !== "MANUAL");
        const btn = document.getElementById("track-toggle-btn");
        if (isAutoTracking) {
            btn.innerText = "■ 자율 추적 중지";
            btn.style.backgroundColor = "#e91e63";
        } else {
            btn.innerText = "🤖 AI 자율 추적 시작";
            btn.style.backgroundColor = "#2196F3";
        }

        const tempDisplay = document.getElementById("pet-temp-display");
        const tempCard = document.getElementById("pet-temp-card");
        const tempEmoji = document.getElementById("temp-emoji");
        
        if (data.pet_temp !== undefined) {
            tempDisplay.innerText = `${data.pet_temp} °C`; 
            const CRITICAL_TEMP = 39.5; 
            
            if (data.pet_temp >= CRITICAL_TEMP) {
                tempCard.style.background = "#da3633"; 
                tempCard.style.borderColor = "#ff4d4d";
                tempEmoji.style.transform = "scale(1.3) rotate(15deg)";
                
                if (Notification.permission === "granted" && !isAlertCooldown) {
                    new Notification("🚨 반려동물 고열 감지 경고", {
                        body: `현재 아이의 체온이 ${data.pet_temp}°C 입니다! 즉시 상태를 확인해 주세요.`,
                        tag: "pet-fever-alert",
                        requireInteraction: true
                    });
                    if (navigator.vibrate) {
                        navigator.vibrate([500, 200, 500, 200, 500]); 
                    }
                    isAlertCooldown = true;
                    setTimeout(() => {
                        isAlertCooldown = false;
                        console.log("알림 쿨다운 해제");
                    }, 30000); 
                }
            } else {
                tempCard.style.background = "#161b22"; 
                tempCard.style.borderColor = "#30363d";
                tempEmoji.style.transform = "scale(1.0) rotate(0deg)";
            }
        }

    } catch (e) {
        document.getElementById("robot-state").innerText = "OFFLINE";
        document.getElementById("robot-state").style.color = "#f44336";
        console.error("상태 업데이트 중 에러 발생:", e);
    }
}

setInterval(updateRobotStatus, 1000);

// ========================================================
// 🛠️ [버그 수정 완료] WebRTC 송수신 전면 재결합 시스템
// ========================================================
const video = document.getElementById("video");
let pc = null;
let localAudioStream = null;

async function startWebRTC(enableAudio = false) {
    if (pc) {
        pc.close(); // 기존 커넥션 초기화 소멸
    }
    
    pc = new RTCPeerConnection({ iceServers: [] });

    pc.ontrack = (event) => {
        console.log("CONTROL PAGE: TRACK RECEIVED");
        video.srcObject = event.streams[0];
    };

    // 영상 수신 트랙은 항상 등록
    pc.addTransceiver("video", { direction: "recvonly" });

    // 마이크 연동 활성화 시 오디오 스트림 결합 후 송신 등록
    if (enableAudio) {
        try {
            localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            localAudioStream.getTracks().forEach(track => pc.addTrack(track, localAudioStream));
        } catch (err) {
            alert("마이크 권한 획득에 실패했습니다: " + err);
            return false;
        }
    }

    // 젯슨 나노 백엔드 서버와 동기화 체결
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const response = await fetch("/offer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            sdp: pc.localDescription.sdp,
            type: pc.localDescription.type
        })
    });

    const answer = await response.json();
    await pc.setRemoteDescription(answer);
    console.log(`CONTROL PAGE: WebRTC CONNECTED (Audio Active: ${enableAudio})`);
    return true;
}

// 마이크 버튼 온/오프 제어 함수
async function toggleMic() {
    const btn = document.getElementById("mic-toggle-btn");
    
    if (btn.classList.contains("active")) {
        // 마이크 끄기
        if (localAudioStream) {
            localAudioStream.getTracks().forEach(track => track.stop());
            localAudioStream = null;
        }
        btn.innerText = "🎤 마이크 오디오 송출 시작";
        btn.style.backgroundColor = "#34495e";
        btn.classList.remove("active");
        await startWebRTC(false); // 오디오 제외하고 순수 영상만 다시 연결
    } else {
        // 마이크 켜기
        const success = await startWebRTC(true); // 오디오 포함하여 새로 동기화 재연결
        if (success) {
            btn.innerText = "🟢 마이크 송출 중 (클릭 시 중지)";
            btn.style.backgroundColor = "#2ecc71";
            btn.classList.add("active");
        }
    }
}

// 페이지 로드 시 기본적으로 영상만 나오도록 초기 실행
startWebRTC(false);
</script>

</body>
</html>
