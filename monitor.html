<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 모니터링</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <div class="app-header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <span style="font-size: 20px; cursor: pointer;" onclick="goHome()">◀</span>
                <h1 style="font-size: 18px; font-weight: 700;">실시간 모니터링</h1>
            </div>
            <div style="font-size: 20px; cursor: pointer;">⋮</div>
        </div>

        <div class="main-content">
            
            <div class="video-wrapper">
                <div class="video-overlay-left">
                    <div class="video-overlay-mode" id="video-mode-overlay">수동 제어</div>
                    <div class="video-overlay-hud">
                        <span class="live-dot-green"></span> 실시간
                    </div>
                </div>
                <div class="video-overlay-quality">HD 📶</div>
                <video id="video" autoplay playsinline muted></video>
            </div>

            <div class="status-grid-2cell">
                <div class="monitor-status-card">
                    <span class="label">추적 상태</span>
                    <div>
                        <div class="value-box">
                            <span style="font-size: 20px;">🎯</span>
                            <span class="value" id="mode-text" style="color: #8b5cf6;">수동 제어</span>
                        </div>
                        <p class="sub-text" id="mode-sub">원격 수동 조종 가능</p>
                    </div>
                </div>

                <div class="monitor-status-card" id="temp-card-container">
                    <span class="label">반려동물 체온</span>
                    <div>
                        <div class="value-box">
                            <span style="font-size: 20px;">🌡️</span>
                            <span class="value" id="pet-temp-display">--.- °C</span>
                        </div>
                        <p class="sub-text" id="temp-sub-text">정상 체온 범위</p>
                    </div>
                </div>
            </div>

            <div class="app-card" style="padding: 14px 20px; margin-bottom: 10px; justify-content: space-between; font-size: 14px; color: #4e5561;">
                <span>인식 객체</span>
                <span id="detected-display" style="font-weight: 700; color: #111;">없음</span>
            </div>

            <div class="app-card" style="padding: 14px 20px; margin-bottom: 25px; justify-content: space-between; font-size: 14px; color: #4e5561;">
                <span>모터 구동 상태 (L/R)</span>
                <span id="motor-text" style="font-weight: 700; color: #111;">0 / 0 RPM</span>
            </div>

            <div class="action-grid single">      
                <button class="action-bar-btn btn-action-purple" id="trackBtn" onclick="toggleTracking()">
                    <span>🧭</span> <span id="track-btn-text">자동 추적 ON</span>
                </button>
            </div>

        </div>

        <div class="bottom-nav">
            <div class="nav-item" onclick="location.href='/'">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">홈</span>
            </div>
            <div class="nav-item active" onclick="location.href='/monitor'">
                <span class="nav-icon">📹</span>
                <span class="nav-text">모니터</span>
            </div>
            <div class="nav-item" onclick="location.href='/control_page'">
                <span class="nav-icon">🎮</span>
                <span class="nav-text">조종</span>
            </div>
            <div class="nav-item" onclick="location.href='/settings'">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text">설정</span>
            </div>
        </div>

    </div>

<script>
let swRegistration = null;
let tracking = false;
let isAlertCooldown = false;

// 1. 초기 로드 시 알림 권한 획득 및 서비스 워커(크롬 튕김 우회) 세팅
document.addEventListener("DOMContentLoaded", () => {
    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register("data:text/javascript,self.addEventListener('notificationclick', function(e) { e.notification.close(); e.waitUntil(clients.matchAll({type: 'window'}).then(function(clientList) { for (var i = 0; i < clientList.length; i++) { var client = clientList[i]; if ('focus' in client) return client.focus(); } if (clients.openWindow) return clients.openWindow('/'); })); });")
        .then(reg => { swRegistration = reg; })
        .catch(err => console.error("서비스 워커 로드 실패:", err));
    }
});

function goHome(){ location.href = "/"; }
function goControl(){ location.href = "/control_page"; }

// 2. 자동 추적 제어 POST 통신 핸들러
async function toggleTracking(){
    try {
        tracking = !tracking;
        await fetch("/control", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command: tracking ? "AUTO_TRACK_ON" : "AUTO_TRACK_OFF" })
        });
        updateButtonUI(tracking);
    } catch(e) {
        console.error("추적 스위치 통신 실패:", e);
    }
}

function updateButtonUI(isTracking) {
    const btnText = document.getElementById("track-btn-text");
    if (isTracking) {
        btnText.innerText = "자동 추적 OFF";
    } else {
        btnText.innerText = "자동 추적 ON";
    }
}

const MODE_LABELS = {
    MANUAL: "수동 제어",
    EXPLORATION: "순찰 중",
    TRACKING: "자동 추적 중",
    RECOVERY: "복구 중"
};

const DETECTED_LABELS = {
    NONE: "없음",
    Dog: "강아지",
    Cat: "고양이"
};

function formatModeLabel(mode) {
    return MODE_LABELS[mode] || mode || "수동 제어";
}

function formatDetectedLabel(detected) {
    return DETECTED_LABELS[detected] || detected || "없음";
}

// 3. 🔥 [동기화 고도화] 1초 주기 상태 동기화 및 홈 화면 알림 연동 엔진
async function updateStatus(){
    try {
        const res = await fetch("/status");
        if (!res.ok) return;
        const data = await res.json();

        const modeLabel = formatModeLabel(data.mode);
        const detectedLabel = formatDetectedLabel(data.detected);

        document.getElementById("detected-display").innerText = detectedLabel;
        document.getElementById("motor-text").innerText = `${data.left} / ${data.right} RPM`;
        document.getElementById("video-mode-overlay").innerText = modeLabel;
        document.getElementById("mode-text").innerText = modeLabel;
        document.getElementById("mode-text").style.color = data.mode === "MANUAL" ? "#8b5cf6" : "#46c98f";
        document.getElementById("mode-sub").innerText = data.detected !== "NONE"
            ? `${detectedLabel} 감지됨`
            : "감지된 객체 없음";

        const tempDisplay = document.getElementById("pet-temp-display");
        const tempCard = document.getElementById("temp-card-container");
        const tempSub = document.getElementById("temp-sub-text");

        if (tempDisplay && data.pet_temp !== undefined) {
            tempDisplay.innerText = `${data.pet_temp} °C`;
            
            const CRITICAL_TEMP = 39.5; // 고열 기준 임계치
            
            if (data.pet_temp >= CRITICAL_TEMP) {
                // UI를 즉시 경고 레이아웃(레드 톤)으로 반전시킵니다.
                tempDisplay.style.color = "#ff4d4d";
                tempSub.innerText = "🚨 고열 감지! 위험 상황";
                tempSub.style.color = "#ff4d4d";
                tempCard.style.background = "#fdeded";
                
                // 30초 쿨다운 타이머가 해제되었을 때만 물리적 알림 작동 및 DB 저장
                if (!isAlertCooldown) {
                    
                    // 🌟 A. 홈 화면 [알림 내역 모달함]으로 타임스탬프 데이터 동시 박제
                    let currentLogs = JSON.parse(localStorage.getItem("pet_fever_logs")) || [];
                    const now = new Date();
                    const timeString = `${now.getMonth()+1}월 ${now.getDate()}일 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                    
                    currentLogs.unshift({
                        id: Date.now(),
                        title: "🚨 [모니터링] 반려동물 고열 감지 경고",
                        body: `아이의 체온이 ${data.pet_temp}°C 로 계측되었습니다.`,
                        time: timeString
                    });
                    localStorage.setItem("pet_fever_logs", JSON.stringify(currentLogs));

                    // B. 스마트폰 상단 푸시 알림 런처 기동
                    const alertOptions = {
                        body: `현재 아이의 체온이 ${data.pet_temp}°C 입니다! 즉시 관제가 필요합니다.`,
                        tag: "pet-fever-alert-monitor",
                        requireInteraction: true
                    };

                    if (Notification.permission === "granted") {
                        if (swRegistration) {
                            swRegistration.showNotification("🚨 반려동물 고열 감지 경고", alertOptions);
                        } else {
                            const fallbackAlert = new Notification("🚨 반려동물 고열 감지 경고", alertOptions);
                            fallbackAlert.onclick = function() { window.focus(); fallbackAlert.close(); };
                        }
                    }
                    
                    if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
                    
                    // 중복 알림 도배 차단용 안전 가드 락 (30초간 동결)
                    isAlertCooldown = true;
                    setTimeout(() => { isAlertCooldown = false; }, 30000);
                }
            } else {
                // 정상 온도로 복구 시 UI 초기화
                tempDisplay.style.color = "#111111";
                tempSub.innerText = "🐾 정상 체온 범위";
                tempSub.style.color = "#b0b5c0";
                tempCard.style.background = "#ffffff";
            }
        }

        // 젯슨 서버 주행 모드와 프론트 버튼 UI 강제 동기화
        tracking = (data.mode !== "MANUAL");
        updateButtonUI(tracking);
    } catch (e) {
        console.error("실시간 모니터링 스탯 동기화 에러:", e);
    }
}
// 💡 서버 멈춤 부하를 완화하기 위해 기존 0.5초에서 1초(1000ms) 주기로 안정화 세팅
setInterval(updateStatus, 1000);

// 4. WebRTC 오디오/비디오 스트리밍 송수신 자원 바인딩
const video = document.getElementById("video");
let pc = null;

async function startWebRTC() {

    if(pc) pc.close();

    pc = new RTCPeerConnection({
        iceServers:[]
    });

    pc.ontrack=(event)=>{
        video.srcObject=event.streams[0];
        video.play();
    };

    pc.addTransceiver(
        "video",
        {direction:"recvonly"}
    );

    const offer=await pc.createOffer();

    await pc.setLocalDescription(offer);

    const response=await fetch("/offer",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            sdp:pc.localDescription.sdp,
            type:pc.localDescription.type
        })
    });

    const answer=await response.json();

    await pc.setRemoteDescription(answer);
}

// 최초 화면 진입 시 영상 스트림만 자동 수신 시작
startWebRTC();
</script>
</body>
</html>
